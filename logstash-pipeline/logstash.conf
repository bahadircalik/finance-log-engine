input {
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Veri Kalite Güvencesi Kontrol Noktası (Data Quality Stage)
  
  # 1. Aşama: Alan Varlık Kontrolü
  if ![txn_id] or ![op] or ![amt] or ![curr] or ![bank] or ![store] or ![mcc] or ![city] or ![lat] or ![lon] or ![auth] or ![status] or ![user] {
    mutate { 
      add_field => { "validation_status" => "quarantined" }
      append => { "tags" => ["missing_fields", "quarantined_transaction"] }
    }
  }

  # 2. Aşama: Gelişmiş Tip ve Sınır Denetimleri (Ruby Engine)
  ruby {
    code => "
      # Tutar Tip Kontrolü
      amt = event.get('amt')
      if amt.nil? || !amt.is_a?(Numeric)
        event.set('validation_status', 'quarantined')
        event.tag('invalid_type_amt')
      end

      # Coğrafi Sınır Denetimi
      lat = event.get('lat')
      lon = event.get('lon')
      if lat.is_a?(Numeric) && lon.is_a?(Numeric)
        if lat < -90 || lat > 90 || lon < -180 || lon > 180
          event.set('validation_status', 'quarantined')
          event.tag('out_of_bounds_geo')
        end
      else
        event.set('validation_status', 'quarantined')
        event.tag('invalid_geo_types')
      end

      # Para Birimi Karakter Uzunluğu Kontrolü
      curr = event.get('curr')
      if curr.is_a?(String) && curr.strip.length != 3
        event.set('validation_status', 'quarantined')
        event.tag('invalid_currency_format')
      end
    "
  }

  # 3. Aşama: Akıllı Yönlendirme (Smart Index Routing)
  if [validation_status] == "quarantined" || "quarantined_transaction" in [tags] {
    mutate {
      add_field => { "[@metadata][target_index]" => "transactions-quarantined" }
    }
  } else {
    mutate {
      add_field => { 
        "[@metadata][target_index]" => "transactions-validated"
        "[location][lat]" => "%{lat}"
        "[location][lon]" => "%{lon}"
      }
      append => { "tags" => "validated_transaction" }
    }
    
    # Konum verilerini ES Geo-Point formatına dönüştür
    mutate {
      convert => {
        "[location][lat]" => "float"
        "[location][lon]" => "float"
      }
    }

    # Anomali ve Yüksek Değer Tespiti
    if [amt] > 15000 {
      mutate { append => { "tags" => ["high_value_transaction", "security_review_required"] } }
    }
  }

  # Logstash sistem çöplerini temizle
  mutate {
    remove_field => ["headers", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "ProductionPassword2026!"
    index => "%{[@metadata][target_index]}"
  }
}
